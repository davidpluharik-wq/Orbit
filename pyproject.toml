[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-workspace"
version = "1.0.0"
description = "A calm, private desktop workspace for projects, notes, and focused work."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "David Pluharik"}]
keywords = ["desktop", "productivity", "kanban", "focus", "pyqt6", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["PyQt6>=6.4,<7"]

[project.optional-dependencies]
dev = ["build>=1", "ruff>=0.11"]

[project.scripts]
orbit = "orbit.desktop:main"

[project.urls]
Homepage = "https://github.com/davidpluharik-wq/Orbit"
Issues = "https://github.com/davidpluharik-wq/Orbit/issues"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.setuptools.package-data]
orbit = ["resources/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
