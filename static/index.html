<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit · Your space to make progress</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">◉ <span>orbit<span class="brand-dot">.</span></span></a><div class="workspace">PERSONAL WORKSPACE</div><nav><button data-view="dashboard" class="active">◫ <span>Overview</span></button><button data-view="board">▦ <span>Task board</span><small id="task-count">0</small></button><button data-view="notes">▤ <span>Notebook</span></button><button data-view="focus">◷ <span>Focus studio</span></button></nav><div class="project-heading">PROJECTS <button id="add-project" title="Create project">+</button></div><div id="projects"></div><div class="sidebar-bottom"><div class="private-dot"></div> Local & private <p>Your work stays on this computer.</p><button id="export">↓ Export backup</button><label class="import">↑ Restore backup<input type="file" id="import" accept="application/json,.json" hidden></label></div></aside>
<main><header><div id="breadcrumb">Workspace / Overview</div><div class="header-right"><input id="search" type="search" placeholder="Search tasks & notes…" aria-label="Search tasks and notes"><span class="avatar">YOU</span></div></header><div id="content"></div><footer>Small steps. Meaningful progress.<span>ORBIT WORKSPACE</span></footer></main>
<dialog id="editor"><form id="editor-form"><div class="modal-top"><h2 id="editor-title">New task</h2><button type="button" id="close-modal" aria-label="Close">×</button></div><div id="editor-fields"></div><div class="modal-actions"><button type="button" id="delete-record" class="danger">Delete</button><button type="submit" class="primary">Save changes ↗</button></div></form></dialog><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
