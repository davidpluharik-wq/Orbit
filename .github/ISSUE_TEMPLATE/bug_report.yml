name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Ubuntu 24.04, Python 3.12, Orbit 1.0.0'
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots
      description: Remove personal notes, tasks, and local paths before sharing.
